location = /reputation { return 301 /reputation/; }

location ^~ /reputation/ {
    client_max_body_size 16k;
    limit_req zone=ai_reputation burst=10 nodelay;
    limit_except GET POST { deny all; }
    # Keep the public prefix so FastAPI root_path and url_for remain correct.
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /reputation;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 60s;
}
